# Pre-merge guards that catch deploy-blocking mistakes BEFORE they hit
# Vercel. The cron check exists because one bad vercel.json cron entry
# froze ALL deploys for 2 days — every subsequent build failed at
# Vercel's gate. The type check exists because `next build` is the only
# other place types are checked, and by then the push is already a deploy.
#
# Runs on every push + PR.

name: CI guards

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-vercel-config:
    name: Validate Vercel cron entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # A bare `npm install tsx` crashes in this pnpm repo (npm can't read
      # the tree: "reading 'edgesOut'"), which failed this job on every push.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate cron entries
        run: pnpm cron:check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next-env.d.ts and the route types are gitignored; generate them
      # the way `next build` would, so tsc sees what the build sees.
      - name: Generate Next types
        run: pnpm exec next typegen

      - name: Type check
        run: pnpm exec tsc --noEmit

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test
